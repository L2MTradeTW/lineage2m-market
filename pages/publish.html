<form class="form" onsubmit="event.preventDefault();alert('V3.0 示範版：後續將串接資料庫與會員系統。')">

<div class="field"><label>價格／懸賞</label><input placeholder="請填寫金額或可提供的報酬"></div>
<div class="field"><label>詳細說明</label><textarea rows="6" placeholder="請完整填寫條件、數量與交付方式"></textarea></div>
<button class="submit">送出刊登</button></form>
