<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="天堂2M 沙哈伊甸交易平台">
  <title>天堂2M｜沙哈伊甸交易平台</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="topbar">
  <a href="index.html" class="brand">天堂2M｜沙哈伊甸交易平台</a>
</header>

<main>
  <section class="hero">
    <div class="hero__shade"></div>
    <div class="hero__content">
      <p>LINEAGE 2M MARKET</p>
      <h1>沙哈伊甸交易平台</h1>
      <span>安全・快速・專業・值得信賴</span>
    </div>
  </section>

  <section class="cards">
    <a class="card" href="account.html">
      <img src="assets/images/account.webp" alt="帳號交易">
      <div class="card__shade"></div>
      <div class="card__text"><h2>帳號交易</h2><b>ACCOUNT</b><p>玩家買賣・平台收購・安心保障</p></div>
    </a>

    <a class="card" href="diamond.html">
      <img src="assets/images/diamond.webp" alt="鑽石交易">
      <div class="card__shade"></div>
      <div class="card__text"><h2>鑽石交易</h2><b>DIAMOND</b><p>平台收售・即時匯率・價格透明</p></div>
    </a>

    <a class="card" href="item.html">
      <img src="assets/images/item.webp" alt="稀有物品">
      <div class="card__shade"></div>
      <div class="card__text"><h2>稀有物品</h2><b>ITEM</b><p>裝備・道具・材料・稀有收藏</p></div>
    </a>

    <a class="card" href="skill.html">
      <img src="assets/images/skill.webp" alt="技能交易">
      <div class="card__shade"></div>
      <div class="card__text"><h2>技能交易</h2><b>SKILL</b><p>技能書・技能卷・專業技能</p></div>
    </a>

    <a class="card card--wide" href="bounty.html">
      <img src="assets/images/quest.webp" alt="任務委託">
      <div class="card__shade"></div>
      <div class="card__text"><h2>任務委託</h2><b>QUEST</b><p>擊殺懸賞・任務委託・平台託管</p></div>
    </a>
  </section>

  <section class="trust">
    <div><strong>安全保障</strong><span>平台爭議協助</span></div>
    <div><strong>快速交易</strong><span>流程清楚透明</span></div>
    <div><strong>專業服務</strong><span>會員驗證制度</span></div>
    <div><strong>創始會員</strong><span>永久費率優惠</span></div>
  </section>
</main>

<footer>本平台為玩家交易服務網站，與遊戲官方無隸屬關係。</footer>

</html>
