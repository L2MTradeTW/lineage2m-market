<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="天堂2M 沙哈伊甸交易平台首頁原型" />
  <title>天堂2M｜沙哈伊甸交易平台</title>
  <style>
    :root {
      --bg: #050504;
      --panel: rgba(12, 11, 8, 0.88);
      --panel-2: rgba(20, 17, 10, 0.9);
      --gold: #d7aa4a;
      --gold-light: #ffe6a0;
      --gold-dark: #6f4a12;
      --text: #f8efda;
      --muted: #b9ad94;
      --border: rgba(216, 170, 74, 0.42);
      --danger: #ff5151;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 0%, rgba(151, 104, 20, 0.16), transparent 30%),
        radial-gradient(circle at 0% 20%, rgba(140, 93, 14, 0.12), transparent 25%),
        radial-gradient(circle at 100% 20%, rgba(140, 93, 14, 0.12), transparent 25%),
        linear-gradient(180deg, #070705 0%, #020202 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.08;
      background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .page {
      width: min(1080px, calc(100% - 24px));
      margin: 0 auto;
      padding: 22px 0 36px;
    }

    .gold-frame {
      position: relative;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(18,15,9,.92), rgba(5,5,4,.94));
      box-shadow: inset 0 0 0 1px rgba(255, 221, 140, 0.05);
    }

    .gold-frame::before,
    .gold-frame::after {
      content: "";
      position: absolute;
      width: 34px;
      height: 34px;
      pointer-events: none;
    }
    .gold-frame::before {
      left: 7px; top: 7px;
      border-left: 1px solid var(--gold);
      border-top: 1px solid var(--gold);
    }
    .gold-frame::after {
      right: 7px; bottom: 7px;
      border-right: 1px solid var(--gold);
      border-bottom: 1px solid var(--gold);
    }

    .hero {
      min-height: 370px;
      padding: 42px 20px 34px;
      overflow: hidden;
      isolation: isolate;
      text-align: center;
      border-radius: 2px;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(90deg, rgba(0,0,0,.2), rgba(0,0,0,.72) 26%, rgba(0,0,0,.58) 50%, rgba(0,0,0,.72) 74%, rgba(0,0,0,.2)),
        url("assets/reference.png") center 7% / cover no-repeat;
      filter: saturate(.85) contrast(1.03);
      opacity: .64;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle at 50% 42%, transparent 0 22%, rgba(0,0,0,.22) 45%, rgba(0,0,0,.56) 100%);
    }

    .brand-mark {
      width: 76px;
      height: 76px;
      margin: 0 auto 8px;
      display: grid;
      place-items: center;
      color: var(--gold-light);
      font-size: 42px;
      line-height: 1;
      border: 1px solid rgba(226,184,83,.52);
      transform: rotate(45deg);
      background: rgba(8,7,4,.72);
      box-shadow: 0 0 28px rgba(218,161,52,.18);
    }
    .brand-mark span { transform: rotate(-45deg); }

    .hero h1 {
      margin: 12px 0 4px;
      font-size: clamp(38px, 7.2vw, 84px);
      line-height: 1.05;
      letter-spacing: .08em;
      color: transparent;
      background: linear-gradient(180deg, #fff4c8 0%, #d9a63f 55%, #7e5214 100%);
      -webkit-background-clip: text;
      background-clip: text;
      text-shadow: 0 0 22px rgba(237, 189, 77, .12);
    }

    .hero .en {
      margin: 5px 0 14px;
      letter-spacing: .42em;
      color: #e7cc8b;
      font-size: 13px;
    }

    .hero h2 {
      margin: 0;
      font-size: clamp(28px, 5vw, 56px);
      letter-spacing: .12em;
      color: var(--gold-light);
      text-shadow: 0 0 18px rgba(236, 182, 61, .18);
    }

    .hero .tagline {
      margin: 18px 0 0;
      letter-spacing: .22em;
      font-size: clamp(15px, 2.2vw, 24px);
      color: #f6f0e4;
    }

    .section { margin-top: 22px; }
    .section-title {
      margin: 0 0 14px;
      text-align: center;
      font-size: 25px;
      color: var(--gold-light);
      letter-spacing: .16em;
      font-weight: 500;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      min-height: 180px;
    }

    .category {
      border: 0;
      border-right: 1px solid rgba(215,170,74,.2);
      color: var(--text);
      background: transparent;
      padding: 26px 10px 22px;
      transition: .22s ease;
    }
    .category:last-child { border-right: 0; }
    .category:hover,
    .category:focus-visible {
      background: rgba(211, 160, 47, .08);
      transform: translateY(-2px);
      outline: none;
    }
    .category .icon {
      display: block;
      font-size: 50px;
      color: var(--gold-light);
      filter: drop-shadow(0 0 8px rgba(229,178,66,.22));
      margin-bottom: 12px;
    }
    .category strong {
      display: block;
      color: #f4d98b;
      font-size: 22px;
      font-weight: 500;
    }
    .category small {
      display: block;
      color: #e8c873;
      letter-spacing: .12em;
      margin-top: 6px;
    }

    .auth-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 22px;
    }
    .auth-btn {
      min-height: 154px;
      border: 1px solid var(--border);
      background: rgba(8,8,6,.82);
      color: var(--gold-light);
      font-size: 34px;
      letter-spacing: .1em;
      position: relative;
      transition: .22s ease;
    }
    .auth-btn.primary {
      background: radial-gradient(circle at 30% 20%, rgba(245,193,74,.38), rgba(74,46,8,.64) 55%, rgba(10,8,4,.92));
      box-shadow: inset 0 0 24px rgba(247,190,64,.11), 0 0 24px rgba(236,174,48,.09);
    }
    .auth-btn:hover { transform: translateY(-2px); border-color: rgba(255,218,121,.85); }
    .auth-btn small {
      display: block;
      margin-top: 12px;
      font-size: 17px;
      letter-spacing: .25em;
      color: #efcf7d;
    }

    .benefit-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 28px 18px;
    }
    .benefit {
      text-align: center;
      padding: 8px 18px;
      border-right: 1px solid rgba(215,170,74,.18);
    }
    .benefit:last-child { border-right: 0; }
    .benefit .icon { font-size: 48px; color: var(--gold-light); }
    .benefit h3 { color: #f2d487; font-size: 22px; margin: 12px 0 8px; }
    .benefit p { color: var(--muted); line-height: 1.7; margin: 0; font-size: 15px; }

    .server-wrap { padding: 22px; }
    .server-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
    }
    .server-btn {
      border: 1px solid rgba(215,170,74,.42);
      background: rgba(5,5,4,.82);
      color: #e6c36f;
      padding: 13px 8px;
      transition: .18s ease;
    }
    .server-btn:hover,
    .server-btn.active {
      color: #fff1bd;
      border-color: #e4b85d;
      background: radial-gradient(circle, rgba(232,176,53,.28), rgba(69,43,8,.55));
      box-shadow: inset 0 0 15px rgba(240,186,64,.14);
    }

    .transaction-wrap { padding: 22px; }
    .transaction-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
    }
    .transaction {
      padding: 12px 18px;
      border-right: 1px solid rgba(215,170,74,.18);
    }
    .transaction:last-child { border-right: 0; }
    .transaction .server { color: #f3d071; font-size: 18px; }
    .transaction .kind { color: var(--muted); margin-top: 5px; }
    .transaction .price { color: var(--gold-light); font-size: 24px; margin-top: 6px; }
    .transaction .time { color: #8f8268; font-size: 13px; margin-top: 6px; }

    footer {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 14px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translate(-50%, 30px);
      opacity: 0;
      pointer-events: none;
      background: #17130b;
      border: 1px solid var(--gold);
      color: #ffe6a0;
      padding: 12px 18px;
      border-radius: 999px;
      transition: .2s ease;
      z-index: 20;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    dialog {
      border: 1px solid var(--gold);
      background: #0b0a07;
      color: var(--text);
      width: min(92vw, 420px);
      padding: 0;
      box-shadow: 0 24px 80px rgba(0,0,0,.7);
    }
    dialog::backdrop { background: rgba(0,0,0,.76); backdrop-filter: blur(4px); }
    .dialog-inner { padding: 26px; }
    .dialog-inner h3 { color: var(--gold-light); font-size: 26px; margin: 0 0 18px; }
    .dialog-inner label { display: block; margin: 12px 0 6px; color: #d8c69f; }
    .dialog-inner input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid rgba(215,170,74,.4);
      background: #050504;
      color: var(--text);
      outline: none;
    }
    .dialog-inner input:focus { border-color: var(--gold); }
    .dialog-actions { display: flex; gap: 10px; margin-top: 20px; }
    .dialog-actions button {
      flex: 1;
      padding: 11px;
      border: 1px solid var(--gold);
      background: #2c1e08;
      color: #ffe7a7;
    }
    .dialog-actions .ghost { background: transparent; color: var(--muted); }

    @media (max-width: 820px) {
      .category-grid { grid-template-columns: repeat(2, 1fr); }
      .category { border-bottom: 1px solid rgba(215,170,74,.18); }
      .category:nth-child(2n) { border-right: 0; }
      .category:last-child { grid-column: 1 / -1; }
      .benefit-grid { grid-template-columns: repeat(2, 1fr); }
      .benefit:nth-child(2) { border-right: 0; }
      .benefit:nth-child(-n+2) { border-bottom: 1px solid rgba(215,170,74,.18); padding-bottom: 22px; }
      .benefit:nth-child(n+3) { padding-top: 22px; }
      .server-grid { grid-template-columns: repeat(3, 1fr); }
      .transaction-grid { grid-template-columns: repeat(2, 1fr); }
      .transaction:nth-child(2) { border-right: 0; }
      .transaction:nth-child(-n+2) { border-bottom: 1px solid rgba(215,170,74,.18); }
    }

    @media (max-width: 560px) {
      .page { width: min(100% - 14px, 1080px); padding-top: 8px; }
      .hero { min-height: 330px; padding: 28px 10px; }
      .hero h1 { letter-spacing: .03em; }
      .hero h2 { letter-spacing: .04em; }
      .hero .tagline { letter-spacing: .08em; }
      .auth-grid { grid-template-columns: 1fr; gap: 12px; }
      .auth-btn { min-height: 118px; font-size: 29px; }
      .benefit-grid { grid-template-columns: 1fr; }
      .benefit, .benefit:nth-child(2) { border-right: 0; border-bottom: 1px solid rgba(215,170,74,.18); padding: 20px 12px; }
      .benefit:last-child { border-bottom: 0; }
      .server-grid { grid-template-columns: repeat(2, 1fr); }
      .transaction-grid { grid-template-columns: 1fr; }
      .transaction, .transaction:nth-child(2) { border-right: 0; border-bottom: 1px solid rgba(215,170,74,.18); }
      .transaction:last-child { border-bottom: 0; }
      footer { gap: 12px 18px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero gold-frame" id="brand">
      <div class="brand-mark" aria-hidden="true"><span>Ⅱ</span></div>
      <h1>天堂2M</h1>
      <div class="en">LINEAGE 2M</div>
      <h2>沙哈伊甸交易平台</h2>
      <p class="tagline">安全・快速・專業・值得信賴</p>
    </section>

    <section class="section gold-frame" aria-label="交易分類">
      <div class="category-grid">
        <button class="category" type="button" data-category="帳號交易"><span class="icon">♙</span><strong>帳號交易</strong><small>ACCOUNT</small></button>
        <button class="category" type="button" data-category="鑽石交易"><span class="icon">♦</span><strong>鑽石交易</strong><small>DIAMOND</small></button>
        <button class="category" type="button" data-category="稀有物品"><span class="icon">♜</span><strong>稀有物品</strong><small>ITEM</small></button>
        <button class="category" type="button" data-category="技能交易"><span class="icon">♧</span><strong>技能交易</strong><small>SKILL</small></button>
        <button class="category" type="button" data-category="任務委託"><span class="icon">▤</span><strong>任務委託</strong><small>QUEST</small></button>
      </div>
    </section>

    <section class="auth-grid" aria-label="會員功能">
      <button class="auth-btn primary" type="button" data-open="loginDialog">會員登入<small>LOGIN</small></button>
      <button class="auth-btn" type="button" data-open="registerDialog">立即註冊<small>REGISTER</small></button>
    </section>

    <section class="section gold-frame" aria-label="平台特色">
      <div class="benefit-grid">
        <article class="benefit"><div class="icon">✦</div><h3>安全交易</h3><p>平台擔保機制<br>交易更有保障</p></article>
        <article class="benefit"><div class="icon">◉</div><h3>AI智能分析</h3><p>AI自動整理數據<br>精準分析角色價值</p></article>
        <article class="benefit"><div class="icon">↗</div><h3>即時行情</h3><p>每日更新價格<br>掌握市場趨勢</p></article>
        <article class="benefit"><div class="icon">♧</div><h3>專業客服</h3><p>線上客服支援<br>快速解決問題</p></article>
      </div>
    </section>

    <section class="section gold-frame server-wrap" aria-label="選擇伺服器">
      <h2 class="section-title">✦　選擇伺服器　✦</h2>
      <div class="server-grid" id="serverGrid">
        <button class="server-btn" type="button">沙哈01</button><button class="server-btn" type="button">沙哈02</button><button class="server-btn active" type="button">沙哈03</button><button class="server-btn" type="button">沙哈04</button><button class="server-btn" type="button">沙哈05</button><button class="server-btn" type="button">沙哈06</button>
        <button class="server-btn" type="button">伊甸01</button><button class="server-btn" type="button">伊甸02</button><button class="server-btn" type="button">伊甸03</button><button class="server-btn" type="button">伊甸04</button><button class="server-btn" type="button">伊甸05</button><button class="server-btn" type="button">伊甸06</button>
      </div>
    </section>

    <section class="section gold-frame transaction-wrap" aria-label="最新成交">
      <h2 class="section-title">✦　最新成交　✦</h2>
      <div class="transaction-grid" id="transactions">
        <article class="transaction"><div class="server">沙哈03</div><div class="kind">帳號交易</div><div class="price">$18,000</div><div class="time">2分鐘前</div></article>
        <article class="transaction"><div class="server">伊甸01</div><div class="kind">鑽石交易</div><div class="price">$1,250</div><div class="time">3分鐘前</div></article>
        <article class="transaction"><div class="server">沙哈05</div><div class="kind">稀有物品</div><div class="price">$3,800</div><div class="time">5分鐘前</div></article>
        <article class="transaction"><div class="server">伊甸02</div><div class="kind">帳號交易</div><div class="price">$25,000</div><div class="time">7分鐘前</div></article>
      </div>
    </section>

    <footer>
      <span>✦ 平台保障</span><span>隱私保護</span><span>反詐騙機制</span><span>安心交易</span>
    </footer>
  </main>

  <dialog id="loginDialog">
    <div class="dialog-inner">
      <h3>會員登入</h3>
      <label for="loginAccount">帳號</label><input id="loginAccount" autocomplete="username" placeholder="請輸入帳號" />
      <label for="loginPassword">密碼</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="請輸入密碼" />
      <div class="dialog-actions"><button type="button" data-demo-action="登入">登入</button><button type="button" class="ghost" data-close>取消</button></div>
    </div>
  </dialog>

  <dialog id="registerDialog">
    <div class="dialog-inner">
      <h3>立即註冊</h3>
      <label for="registerName">暱稱</label><input id="registerName" placeholder="公開顯示的暱稱" />
      <label for="registerContact">手機或Email</label><input id="registerContact" placeholder="作為登入與驗證使用" />
      <div class="dialog-actions"><button type="button" data-demo-action="註冊">建立帳號</button><button type="button" class="ghost" data-close>取消</button></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const toast = document.getElementById('toast');
    let toastTimer;
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    document.querySelectorAll('[data-category]').forEach(btn => {
      btn.addEventListener('click', () => showToast(`${btn.dataset.category}：下一步將製作此頁面`));
    });

    document.querySelectorAll('[data-open]').forEach(btn => {
      btn.addEventListener('click', () => document.getElementById(btn.dataset.open).showModal());
    });
    document.querySelectorAll('[data-close]').forEach(btn => {
      btn.addEventListener('click', () => btn.closest('dialog').close());
    });
    document.querySelectorAll('[data-demo-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        showToast(`${btn.dataset.demoAction}功能目前為介面示範`);
        btn.closest('dialog').close();
      });
    });

    document.querySelectorAll('.server-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.server-btn').forEach(item => item.classList.remove('active'));
        btn.classList.add('active');
        showToast(`已選擇 ${btn.textContent}`);
      });
    });
  </script>
</body>
</html>
